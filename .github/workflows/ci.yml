name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vercel builds independently; this is the gate that stops a broken commit
# reaching main in the first place.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Majors kept current: v4 of these targeted Node 20, which GitHub has
      # deprecated and is already force-running on Node 24.
      #
      # No `version:` input on purpose. action-setup v4 reads the version from
      # package.json's `packageManager` field, and refuses to run when both are
      # given -- "Multiple versions of pnpm specified" -- which failed this
      # workflow before a single step of it had executed.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The build reads none of the real secrets — content is compiled in
          # and every page is static — but env parsing rejects the example salt
          # in production, so CI supplies a throwaway one.
          ANALYTICS_SALT: ci-build-salt-not-used-at-runtime
          NEXT_PUBLIC_SITE_URL: https://www.alwint.dev

      - name: No fabricated content in the build
        # The site once shipped a set of invented awards because the content was
        # fetched at build time from a stale service. Content is compiled in
        # now, so this should be structurally impossible — assert it anyway.
        run: |
          if grep -rlF --include='*.js' --include='*.html' --include='*.rsc' \
              -e 'Nexus AI Labs' -e 'Atlas RAG' -e 'TinyTune' -e 'NumFOCUS' \
              -e "Dean's List" web/.next/server web/.next/static 2>/dev/null; then
            echo "::error::placeholder content found in the build output"
            exit 1
          fi
          echo "clean"
